<body>


<div class="app">


<div class="page">


<h1 class="page-title">
🏆 جوائزي
</h1>


<div class="reward">

⭐ النجوم:
<span id="stars"></span>

</div>


<div class="reward" id="level">

</div>



<a class="button-small" href="index.html">
🏠 الرئيسية
</a>


</div>

<script src="storage.js"></script>
<script src="js/origin-warning.js"></script>

<script>


let stars =
getStars();


document.getElementById("stars")
.innerHTML=stars;



let level="🌱 مبتدئة";


if(stars>=5)
level="🌸 فنانة صغيرة";


if(stars>=15)
level="👑 أميرة الرسم";


if(stars>=30)
level="💎 نجمة الفن";


document.getElementById("level")
.innerHTML=level;



</script>
